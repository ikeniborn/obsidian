[couchdb]
single_node=true
max_document_size = 50000000
; Priority 2: Optimize write performance (3-5x faster bulk writes)
delayed_commits = true
file_compression = snappy
; Priority 4: Query optimization (applied conservatively)
max_dbs_open = 1000
attachment_compression_level = 6

[chttpd]
require_valid_user = true
; 1 GB: LiveSync initial-sync / rebuild _bulk_docs batches can exceed 100 MB,
; which CouchDB rejects with 413 (the request entity is too large). Matches the
; nginx client_max_body_size. To run this lower (better DoS/memory protection),
; reduce the LiveSync client batch size so requests stay small. See docs/troubleshooting.md.
max_http_request_size = 1073741824
; Priority 3: Connection limits to prevent resource exhaustion
max_connections = 200

[chttpd_auth]
require_valid_user = true
authentication_redirect = /_utils/session.html

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true
; Priority 5: Enable gzip compression for HTTP responses
compression = true

[cors]
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600

; Automatic compaction via smoosh daemon (CouchDB 3.x)
; NOTE: [compaction_daemon] + [compactions] are CouchDB 2.x syntax and ignored in 3.x
;
; DISABLED 2026-06-18 (disk-full / compaction-loop incident): on a near-full
; disk smoosh writes a temporary *.couch.compact.data the size of the active
; db (~17G for `work`), the full disk kills it mid-way, and it retries every
; cycle -> orphan *.compact.* files + HTTP 500 on write. Empty channels keep
; the daemon idle. Re-enable (restore the channel lists below) only AFTER the
; DB bloat is reset (drop+recreate, Rebuild->Overwrite remote) and the disk has
; >2x the largest db free. See docs/wiki/troubleshooting.md#HTTP 500.
[smoosh]
db_channels =
view_channels =

[smoosh.ratio_dbs]
; Compact when file/active ratio > 1.25 (~20% fragmentation)
min_priority = 1.25
wait = 30

[smoosh.slack_dbs]
; Compact when wasted space > 200MB
min_priority = 209715200
wait = 30

[smoosh.ratio_views]
min_priority = 1.25
wait = 30

[smoosh.slack_views]
min_priority = 209715200
wait = 30

; Priority 4: Query server optimization
[query_server_config]
; Increase timeout for complex views (10 seconds)
os_process_timeout = 10000
; Max 50 concurrent external processes
os_process_soft_limit = 50

; Priority 7: Logging and monitoring
[log]
; Log only warnings and above (reduce noise)
level = warning
writer = stderr

[stats]
; Collect statistics every 10 seconds
interval = 10